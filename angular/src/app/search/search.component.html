<div class="container mt-4">
  <h2>Search Everything</h2>
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Find Your Perfect Travel Options</h5>
      <div class="row">
        <div class="col-md-8">
          <label for="searchQuery">Search Query</label>
          <input
            type="text"
            id="searchQuery"
            class="form-control"
            placeholder="Enter destination, hotel, car, or package name"
            [(ngModel)]="searchQuery"
            (keyup.enter)="onSearch()"
          >
        </div>
        <div class="col-md-4">
          <label>&nbsp;</label>
          <button
            class="btn btn-primary w-100"
            (click)="onSearch()"
            [disabled]="isLoading"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            {{ isLoading ? 'Searching...' : 'Search All' }}
          </button>
        </div>
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>
    </div>
  </div>

  <div class="mt-4" *ngIf="searchResults.length > 0">
    <h4>Search Results</h4>
    <div class="row">
      <div class="col-md-4 mb-3" *ngFor="let result of searchResults">
        <div class="card">
          <div class="card-body">
            <h5>
              <span *ngIf="result.type === 'flight'">✈️</span>
              <span *ngIf="result.type === 'hotel'">🏨</span>
              <span *ngIf="result.type === 'car'">🚗</span>
              <span *ngIf="result.type === 'package'">📦</span>
              {{ result.title }}
            </h5>
            <p>{{ result.description }}</p>
            <p class="text-success fw-bold">${{ result.price }}</p>
            <button
              class="btn btn-outline-primary btn-sm"
              (click)="onBook(result)"
            >
              Book {{ result.type | titlecase }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4" *ngIf="!isLoading && searchResults.length === 0 && searchQuery">
    <h4>No Results Found</h4>
    <p>Try adjusting your search query or check back later for more options.</p>
  </div>
</div>
